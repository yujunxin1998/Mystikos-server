# 本地开发依赖服务：PostgreSQL / Redis / MinIO。
# 镜像版本、挂载路径、环境变量都跟 README.md 里对应服务的 `docker run` 命令保持一致
# （那份手动命令原样保留，作为不想用 compose 时的等价物）。
# 用法：docker compose -f deploy/docker/docker-compose.yaml up -d

name: mystikos

services:
  app:
    image: eclipse-temurin:17-jre
    container_name: mystikos-app
    restart: unless-stopped
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=75.0", "-Dfile.encoding=UTF-8", "-jar", "/app/mystikos-app.jar"]
    env_file:
      - ../../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mystikos
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://116.62.218.227:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # 登录密码 RSA 加密（见根目录 README「登录密码 RSA 加密」一节）。密钥文件通过下面的只读
      # volume 挂载进容器，不打包进镜像、不进 Git；LOGIN_RSA_ENABLED=false 时可以不挂载这两个文件。
      LOGIN_RSA_ENABLED: ${LOGIN_RSA_ENABLED:-false}
      LOGIN_RSA_KEY_ID: ${LOGIN_RSA_KEY_ID:-login-key-v1}
      LOGIN_RSA_PUBLIC_KEY_PATH: ${LOGIN_RSA_PUBLIC_KEY_PATH:-/run/secrets/login-public-key.pem}
      LOGIN_RSA_PRIVATE_KEY_PATH: ${LOGIN_RSA_PRIVATE_KEY_PATH:-/run/secrets/login-private-key.pem}
    ports:
      - "8099:8099"
    volumes:
      - ../../mystikos-app.jar:/app/mystikos-app.jar:ro
      - ../sql:/app/deploy/sql:ro
      # 需要启用登录 RSA 加密时再取消注释这两行，deploy/keys/login/ 换成实际密钥文件所在目录
      # （该目录已在 .gitignore 排除，不会被提交）。LOGIN_RSA_ENABLED=false（默认）时不需要挂载——
      # 挂载一个宿主机不存在的文件，Docker 会在宿主机上自动创建出一个空目录占位，反而留下垃圾文件。
      # - ../keys/login/public-key.pem:/run/secrets/login-public-key.pem:ro
      # - ../keys/login/private-key.pem:/run/secrets/login-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: mystikos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mystikos
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - F:/javaproj/Mystikos/local-docker/postgres/data:/var/lib/postgresql/data
      # EXCLUDE USING gist 约束依赖的 btree_gist 扩展，只在数据目录第一次初始化时自动跑一次
      # （官方镜像的约定：/docker-entrypoint-initdb.d/ 下的脚本只在 initdb 时执行）。
      # 如果 local-docker/postgres/data 已经初始化过（比如从手动 docker run 迁过来的），
      # 这个脚本不会重跑，仍需手动执行一次 README 里那条 CREATE EXTENSION 命令。
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mystikos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: mystikos-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - F:/javaproj/Mystikos/local-docker/redis/config/redis.conf:/usr/local/etc/redis/redis.conf
      - F:/javaproj/Mystikos/local-docker/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: mystikos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://116.62.218.227:9000}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://116.62.218.227:9001}
    volumes:
      - F:/javaproj/Mystikos/local-docker/minIo/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
