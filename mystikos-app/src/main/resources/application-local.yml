# 本地开发：使用 163 邮箱 SMTP 进行真实邮件投递测试。
# MAIL_SMTP_PASSWORD 必须填写 163 邮箱客户端授权码，不是网页登录密码。
spring:
  mail:
    host: ${MAIL_SMTP_HOST:smtp.163.com}
    port: ${MAIL_SMTP_PORT:465}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: ${MAIL_SMTP_PORT:465}
          starttls:
            enable: false

mystikos:
  mail:
    enabled: true
    # 163 通常要求发件人与 SMTP 登录账号一致。
    from: ${MAIL_FROM:${MAIL_SMTP_USERNAME:}}
  sms:
    aliyun:
      # 默认 false，避免本地随手测试产生真实短信费用。
      enabled: ${ALIYUN_SMS_ENABLED:false}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      verification-template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
